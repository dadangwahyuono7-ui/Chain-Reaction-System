          selectedDrawingId = null;
          localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
        }
      }
    });

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function findDrawingAt(px, py) {
      for (let i = userDrawings.length - 1; i >= 0; i--) {
        const d = userDrawings[i];
        const x1 = timeToX(d.t1);
        const y1 = priceToY(d.p1);
        const x2 = timeToX(d.t2);
        const y2 = priceToY(d.p2);

        if (d.type === 'line') {
          const dist = distToSegment(px, py, x1, y1, x2, y2);
          if (dist <= 12) return d;
        } else if (d.type === 'box') {
          const minX = Math.min(x1, x2) - 6;
          const maxX = Math.max(x1, x2) + 6;
          const minY = Math.min(y1, y2) - 6;
          const maxY = Math.max(y1, y2) + 6;
          if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
            return d;
          }
        }
      }
      return null;
    }

    function drawUserDrawings(plotWidth, plotHeight) {
      ctx.save();
      activeDeleteBtnRect = null;

      // 1. Render all saved user drawings
      for (let i = 0; i < userDrawings.length; i++) {
        const d = userDrawings[i];
        const x1 = timeToX(d.t1);
        const y1 = priceToY(d.p1);
        const x2 = timeToX(d.t2);
        const y2 = priceToY(d.p2);
        const isSelected = d.id === selectedDrawingId;

        if (d.type === 'line') {
          // Trendline
          ctx.strokeStyle = isSelected ? '#ffd700' : (d.color || '#00e5ff');
          ctx.lineWidth = isSelected ? 3.0 : 2.0;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          // Endpoint Handles
          ctx.fillStyle = isSelected ? '#ffd700' : '#ffffff';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(x1, y1, isSelected ? 5.0 : 3.5, 0, Math.PI * 2);
          ctx.arc(x2, y2, isSelected ? 5.0 : 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Floating mini delete pill for selected line
          if (isSelected) {
            const midX = (x1 + x2) / 2;
            const midY = Math.min(y1, y2) - 18;
            const pillW = 62;
            const pillH = 18;
            const pillX = midX - pillW / 2;
            const pillY = midY;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
            ctx.strokeStyle = '#ff3b5c';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(pillX, pillY, pillW, pillH, 4);
            else ctx.rect(pillX, pillY, pillW, pillH);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff3b5c';
            ctx.font = 'bold 8.5px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❌ HAPUS', pillX + pillW / 2, pillY + pillH / 2);

            activeDeleteBtnRect = { x: pillX, y: pillY, w: pillW, h: pillH, id: d.id };
          }
        } else if (d.type === 'box') {
          // Rectangle Box
          const rx = Math.min(x1, x2);
          const ry = Math.min(y1, y2);
          const rw = Math.abs(x2 - x1);
          const rh = Math.abs(y2 - y1);

          ctx.fillStyle = isSelected ? 'rgba(255, 215, 0, 0.22)' : (d.fillColor || 'rgba(0, 229, 255, 0.18)');
          ctx.fillRect(rx, ry, rw, rh);
          ctx.strokeStyle = isSelected ? '#ffd700' : (d.strokeColor || '#00e5ff');
          ctx.lineWidth = isSelected ? 2.5 : 1.5;
          ctx.strokeRect(rx, ry, rw, rh);

          // Selection Corner Handles
          if (isSelected) {
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(rx - 3, ry - 3, 6, 6);
            ctx.fillRect(rx + rw - 3, ry - 3, 6, 6);
            ctx.fillRect(rx - 3, ry + rh - 3, 6, 6);
            ctx.fillRect(rx + rw - 3, ry + rh - 3, 6, 6);

            // Floating delete pill for selected box
            const pillW = 62;
            const pillH = 18;
            const pillX = rx + rw / 2 - pillW / 2;
            const pillY = ry - 22;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
            ctx.strokeStyle = '#ff3b5c';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(pillX, pillY, pillW, pillH, 4);
            else ctx.rect(pillX, pillY, pillW, pillH);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff3b5c';
            ctx.font = 'bold 8.5px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❌ HAPUS', pillX + pillW / 2, pillY + pillH / 2);

            activeDeleteBtnRect = { x: pillX, y: pillY, w: pillW, h: pillH, id: d.id };
          }
        }
      }

      // 2. Render live in-progress drawing preview
      if (activeDrawTool && drawStart && drawCurrent) {
        const x1 = timeToX(drawStart.t);
        const y1 = priceToY(drawStart.p);
        const x2 = timeToX(drawCurrent.t);
        const y2 = priceToY(drawCurrent.p);

        if (activeDrawTool === 'line') {
          ctx.strokeStyle = '#ffd600';
          ctx.lineWidth = 2.0;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.setLineDash([]);
        } else if (activeDrawTool === 'box') {
          const rx = Math.min(x1, x2);
          const ry = Math.min(y1, y2);
          const rw = Math.abs(x2 - x1);
          const rh = Math.abs(y2 - y1);

          ctx.fillStyle = 'rgba(255, 214, 0, 0.22)';
          ctx.fillRect(rx, ry, rw, rh);
          ctx.strokeStyle = '#ffd600';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(rx, ry, rw, rh);
          ctx.setLineDash([]);
        }
      }

      ctx.restore();
    }

    // --- INTERACTION EVENT LISTENERS ---
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 1. Check if clicked on floating single-item delete button
      if (activeDeleteBtnRect) {
        const r = activeDeleteBtnRect;
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
          userDrawings = userDrawings.filter((d) => d.id !== r.id);
          selectedDrawingId = null;
          activeDeleteBtnRect = null;
          localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
          return;
        }
      }

      if (activeDrawTool) {
        drawStart = { t: xToTime(x), p: yToPrice(y) };
        drawCurrent = { t: drawStart.t, p: drawStart.p };
        return;
      }

      // 2. If not drawing, check if clicking on a drawing to select it
      const clickedDrawing = findDrawingAt(x, y);
      if (clickedDrawing) {
        selectedDrawingId = clickedDrawing.id;
        return;
      } else {
        selectedDrawingId = null;
      }

      // Check click on floating Snap-to-Live button
      const isScrolledBack = timeEnd < (Math.floor(Date.now() / 1000) + rightOffsetSec - 25);
      if (isScrolledBack) {
        const snapBtnW = 112;
        const snapBtnH = 22;
        const snapBtnX = (width - rightMargin) - snapBtnW - 12;
        const snapBtnY = (height - bottomMargin) - subPanelHeight - snapBtnH - 10;
        if (x >= snapBtnX && x <= snapBtnX + snapBtnW && y >= snapBtnY && y <= snapBtnY + snapBtnH) {
          const curT = Math.floor(Date.now() / 1000);
          timeEnd = curT + rightOffsetSec;
          timeStart = timeEnd - timeWindowSec;
          return;
        }
      }

      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      if (x > width - rightMargin) {
        isDraggingPriceScale = true;
      } else if (y > height - bottomMargin) {
        isDraggingTimeScale = true;
      }
    });

    window.addEventListener('mouseup', () => {
      if (activeDrawTool && drawStart && drawCurrent) {
        if (Math.abs(drawStart.t - drawCurrent.t) > 2 || Math.abs(drawStart.p - drawCurrent.p) > 0.05) {
          userDrawings.push({
            id: Date.now(),
            type: activeDrawTool,
            t1: drawStart.t,
            p1: drawStart.p,
            t2: drawCurrent.t,
            p2: drawCurrent.p,
            color: '#00e5ff',
            fillColor: 'rgba(0, 229, 255, 0.18)',
            strokeColor: '#00e5ff'
          });
          localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
        }
        drawStart = null;
        drawCurrent = null;
        activeDrawTool = null;
        updateDrawButtonsUI();
        return;
      }

      isDragging = false;
      isDraggingPriceScale = false;
      isDraggingTimeScale = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;

      if (activeDrawTool && drawStart) {
        drawCurrent = { t: xToTime(mouseX), p: yToPrice(mouseY) };
        return;
      }

      if (mouseX > width - rightMargin) {
        canvas.style.cursor = 'ns-resize';
      } else if (mouseY > height - bottomMargin) {
        canvas.style.cursor = 'ew-resize';
      } else if (isDragging) {
        canvas.style.cursor = 'grabbing';
      } else {
        canvas.style.cursor = 'crosshair';
      }

      if (isDragging) {
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;

        if (isDraggingPriceScale) {
          const factor = 1 + dy * 0.005;
          priceSpan = Math.max(2.0, priceSpan * factor);
          priceMin = priceCenter - priceSpan / 2;
          priceMax = priceCenter + priceSpan / 2;
        } else if (isDraggingTimeScale) {
          const factor = 1 - dx * 0.005;
          timeWindowSec = Math.max(60, Math.min(3600 * 24 * 30, timeWindowSec * factor));
          timeStart = timeEnd - timeWindowSec;
          rightOffsetSec = timeEnd - nowSec;
        } else {
          const dt = (dx / (width - rightMargin)) * (timeEnd - timeStart);
          timeStart -= dt;
          timeEnd -= dt;
          rightOffsetSec = timeEnd - nowSec;

          const dp = (dy / (height - bottomMargin - subPanelHeight)) * priceSpan;
          priceCenter += dp;
          priceMin = priceCenter - priceSpan / 2;
          priceMax = priceCenter + priceSpan / 2;
        }

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 1.10 : 0.90;
      const cursorTime = xToTime(mouseX);

      timeStart = cursorTime - (cursorTime - timeStart) * zoomFactor;
      timeEnd = cursorTime + (timeEnd - cursorTime) * zoomFactor;
      timeWindowSec = timeEnd - timeStart;
      rightOffsetSec = timeEnd - nowSec;
    }, { passive: false });

    // --- 📱 MOBILE TOUCH ENGINE (1-FINGER PAN, 2-FINGER PINCH-ZOOM, TOUCH SCALE) ---
    let isTouching = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchLastX = 0;
    let touchLastY = 0;
    let touchStartTime = 0;
    let initialPinchDist = 0;
    let initialTimeWindow = 0;
    let initialPriceSpan = 0;
    let isTouchingPriceScale = false;

    function getTouchDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchMidpoint(t1, t2, rect) {
      return {
        x: ((t1.clientX + t2.clientX) / 2) - rect.left,
        y: ((t1.clientY + t2.clientY) / 2) - rect.top
      };
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      touchStartTime = performance.now();

      if (e.touches.length === 1) {
        const t = e.touches[0];
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;

        // Check if tapped floating single-item delete button
        if (activeDeleteBtnRect) {
          const r = activeDeleteBtnRect;
          if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
            userDrawings = userDrawings.filter((d) => d.id !== r.id);
            selectedDrawingId = null;
            activeDeleteBtnRect = null;
            localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
            return;
          }
        }

        if (activeDrawTool) {
          drawStart = { t: xToTime(x), p: yToPrice(y) };
          drawCurrent = { t: drawStart.t, p: drawStart.p };
          return;
        }

        const clickedDrawing = findDrawingAt(x, y);
        if (clickedDrawing) {
          selectedDrawingId = clickedDrawing.id;
          return;
        } else {
          selectedDrawingId = null;
        }

        // Check tap on floating Snap-to-Live button
        const isScrolledBack = timeEnd < (Math.floor(Date.now() / 1000) + rightOffsetSec - 25);
        if (isScrolledBack) {
          const snapBtnW = 112;
          const snapBtnH = 22;
          const snapBtnX = (width - rightMargin) - snapBtnW - 12;
          const snapBtnY = (height - bottomMargin) - subPanelHeight - snapBtnH - 10;
          if (x >= snapBtnX && x <= snapBtnX + snapBtnW && y >= snapBtnY && y <= snapBtnY + snapBtnH) {
            const curT = Math.floor(Date.now() / 1000);
            timeEnd = curT + rightOffsetSec;
            timeStart = timeEnd - timeWindowSec;
            return;
          }
        }

        isTouching = true;
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchLastX = t.clientX;
        touchLastY = t.clientY;

        isTouchingPriceScale = x > width - rightMargin;
        mouseX = x;
        mouseY = y;
      } else if (e.touches.length === 2) {
        isTouching = true;
        isTouchingPriceScale = false;
        initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
        initialTimeWindow = timeWindowSec;
        initialPriceSpan = priceSpan;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();

      if (e.touches.length === 1) {
        const t = e.touches[0];
        mouseX = t.clientX - rect.left;
        mouseY = t.clientY - rect.top;

        if (activeDrawTool && drawStart) {
          drawCurrent = { t: xToTime(mouseX), p: yToPrice(mouseY) };
          return;
        }

        if (!isTouching) return;
        const dx = t.clientX - touchLastX;
        const dy = t.clientY - touchLastY;

        if (isTouchingPriceScale) {
          // Vertical price zoom on right scale drag
          const factor = 1 + dy * 0.008;
          priceSpan = Math.max(2.0, priceSpan * factor);
          priceMin = priceCenter - priceSpan / 2;
          priceMax = priceCenter + priceSpan / 2;
        } else {
          // 1-Finger Smooth Pan (Time X & Price Y)
          const dt = (dx / (width - rightMargin)) * (timeEnd - timeStart);
          timeStart -= dt;
          timeEnd -= dt;
          rightOffsetSec = timeEnd - nowSec;

          const dp = (dy / (height - bottomMargin - subPanelHeight)) * priceSpan;
          priceCenter += dp;
          priceMin = priceCenter - priceSpan / 2;
          priceMax = priceCenter + priceSpan / 2;
        }

        touchLastX = t.clientX;
        touchLastY = t.clientY;
      } else if (e.touches.length === 2) {
        // 2-Finger Pinch Zoom (Time & Price)
        const curDist = getTouchDistance(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0 && curDist > 0) {
          const zoomFactor = initialPinchDist / curDist;
          const mid = getTouchMidpoint(e.touches[0], e.touches[1], rect);
          const cursorTime = xToTime(mid.x);

          // Zoom Time
          timeWindowSec = Math.max(30, Math.min(3600 * 24 * 30, initialTimeWindow * zoomFactor));
          timeStart = cursorTime - (cursorTime - timeStart) * (timeWindowSec / (timeEnd - timeStart));
          timeEnd = timeStart + timeWindowSec;
          rightOffsetSec = timeEnd - nowSec;

          // Zoom Price
          priceSpan = Math.max(2.0, initialPriceSpan * zoomFactor);
          priceMin = priceCenter - priceSpan / 2;
          priceMax = priceCenter + priceSpan / 2;
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (activeDrawTool && drawStart && drawCurrent) {
        if (Math.abs(drawStart.t - drawCurrent.t) > 2 || Math.abs(drawStart.p - drawCurrent.p) > 0.05) {
          userDrawings.push({
            id: Date.now(),
            type: activeDrawTool,
            t1: drawStart.t,
            p1: drawStart.p,
            t2: drawCurrent.t,
            p2: drawCurrent.p,
            color: '#00e5ff',
            fillColor: 'rgba(0, 229, 255, 0.18)',
            strokeColor: '#00e5ff'
          });
          localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
        }
        drawStart = null;
        drawCurrent = null;
        activeDrawTool = null;
        updateDrawButtonsUI();
        return;
      }

      if (e.touches.length === 0) {
        isTouching = false;
        isTouchingPriceScale = false;
      } else if (e.touches.length === 1) {
        touchLastX = e.touches[0].clientX;
        touchLastY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => {
      isTouching = false;
      isTouchingPriceScale = false;
    });

    // ⌨️ KEYBOARD SHORTCUTS
    window.addEventListener('keydown', (e) => {
      // Don't fire if typing in an input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      switch (e.key.toLowerCase()) {
        case 'l': // Line tool
          activeDrawTool = activeDrawTool === 'line' ? null : 'line';
          selectedDrawingId = null; drawStart = null; drawCurrent = null;
          updateDrawButtonsUI(); break;
        case 'b': // Box tool
          activeDrawTool = activeDrawTool === 'box' ? null : 'box';
          selectedDrawingId = null; drawStart = null; drawCurrent = null;
          updateDrawButtonsUI(); break;
        case 'z': // Undo last drawing
          if (selectedDrawingId) {
            userDrawings = userDrawings.filter(d => d.id !== selectedDrawingId);
            selectedDrawingId = null;
          } else {
            userDrawings.pop();
          }
          localStorage.setItem('cr_drawings', JSON.stringify(userDrawings)); break;
        case 'escape': // Cancel active draw tool
          activeDrawTool = null; drawStart = null; drawCurrent = null;
          updateDrawButtonsUI(); break;
        case 'delete': // Already handled above but reinforce for non-selected mode
          if (selectedDrawingId) {
            userDrawings = userDrawings.filter(d => d.id !== selectedDrawingId);
            selectedDrawingId = null;
            localStorage.setItem('cr_drawings', JSON.stringify(userDrawings));
          } break;
        case 's': // Screenshot
          if (e.ctrlKey || e.metaKey) break; // Don't intercept Ctrl+S (browser save)
          const link = document.createElement('a');
          link.download = `CR-PRO_${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click(); break;
      }
    });

    // 🔔 PRICE ALERT: Right-click on price axis to set/clear alert
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const plotWidth = width - rightMargin;
      if (x >= plotWidth) {
        // Right-click on price axis → set alert at this price
        const alertPrice = yToPrice(y);
        if (priceAlertLevel && Math.abs(priceAlertLevel - alertPrice) < 0.5) {
          priceAlertLevel = null; // Clear if clicking near existing alert
          priceAlertTriggered = false;
        } else {
          priceAlertLevel = Math.round(alertPrice * 4) / 4; // Snap to 0.25 increment
          priceAlertTriggered = false;
          // Show mini toast
          const toast = document.getElementById('whale-toast');
          toast.innerHTML = `🔔 ALERT SET @ $${priceAlertLevel.toFixed(2)}`;
          toast.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.18), rgba(15,23,42,0.98))';
          toast.style.border = '1.5px solid rgba(251,191,36,0.7)';
          toast.style.color = '#fbbf24';
          toast.classList.add('active');
          setTimeout(() => toast.classList.remove('active'), 2500);
        }
      }
    });

    // --- UI TOGGLES ---
    document.getElementById('btn-toggle-candle').onclick = function () {
      showCandles = !showCandles;
      this.classList.toggle('active', showCandles);
    };
    document.getElementById('btn-toggle-heatmap').onclick = function () {
      showHeatmap = !showHeatmap;
      this.classList.toggle('active', showHeatmap);
    };
    document.getElementById('btn-toggle-bubbles').onclick = function () {
      showBubbles = !showBubbles;
      this.classList.toggle('active', showBubbles);
    };
    document.getElementById('btn-toggle-profile').onclick = function () {
      showProfile = !showProfile;
      this.classList.toggle('active', showProfile);
    };
    document.getElementById('btn-toggle-cmp').onclick = function () {
      showCmp = !showCmp;
      this.classList.toggle('active', showCmp);
    };

    document.getElementById('btn-fullscreen').onclick = function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    document.getElementById('btn-autofit').onclick = function () {
      const curTime = Math.floor(Date.now() / 1000);
      const tfSec = getTimeframeSeconds(currentTimeframe);
      timeWindowSec = tfSec * 80;
      rightOffsetSec = tfSec * 15;
      timeEnd = curTime + rightOffsetSec;
      timeStart = timeEnd - timeWindowSec;
      priceCenter = currentSpotPrice;
      priceSpan = 22.00;
      priceMin = priceCenter - priceSpan / 2;
      priceMax = priceCenter + priceSpan / 2;
      seedContinuousDepthFromRealWalls();
    };

    // Timeframe dropdown listener
    const tfSelect = document.getElementById('tf-select');
    if (tfSelect) {
      tfSelect.onchange = function () {
        currentTimeframe = this.value;
        const tfSec = getTimeframeSeconds(currentTimeframe);
        timeWindowSec = tfSec * 80;
        rightOffsetSec = tfSec * 15;
        timeEnd = nowSec + rightOffsetSec;
        timeStart = timeEnd - timeWindowSec;
        if (candleVault[currentTimeframe] && candleVault[currentTimeframe].length > 0) {
          candles = candleVault[currentTimeframe];
          updateHeaderOhlc(candles[candles.length - 1]);
        }
        seedContinuousDepthFromRealWalls();
      };
    }

    // --- STARTUP ---
    loadRealHistoricalData();
    setInterval(fetchRealLiveStatus, 350);
    requestAnimationFrame(render);

  })();
  </script>
</body>
